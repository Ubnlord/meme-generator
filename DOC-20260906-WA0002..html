<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤖 Free AI Meme Generator — No Signup Needed!</title>
    <style>
        *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Roboto, sans-serif;}
        :root{
            --prim:#6C5CE7; --sec:#FF6B6B; --accent:#00D9FF; --dark:#1A1A2E; --dark2:#2C2C44;
            --light:#F7F7F7; --card:#2C2C44; --text-light:#fff; --text-dark:#1A1A2E;
            --success:#00D68F; --fb:#1877F2; --tt:#000; --x:#000;
            --radius:16px; --shadow:0 8px 30px rgba(0,0,0,0.3); --free:#10B981;
        }
        .light-mode{
            --dark:#EDF2F7; --dark2:#E2E8F0; --card:#FFFFFF; --text-dark:#1A1A2E; --text-light:#1A1A2E;
        }
        body{background:linear-gradient(135deg,var(--dark),var(--dark2)); color:var(--text-light); min-height:100vh; padding:20px; transition:all .3s;}
        .container{max-width:1400px; margin:0 auto;}
        header{text-align:center; padding:20px 20px 30px; position:relative;}
        .free-badge{display:inline-block; background:var(--free); color:white; padding:6px 16px; border-radius:30px; font-weight:700; font-size:.95rem; margin-bottom:10px;}
        .theme-toggle{position:absolute; right:0; top:0; background:transparent; border:none; font-size:1.5rem; cursor:pointer;}
        h1{font-size:clamp(1.8rem,5vw,3rem); background:linear-gradient(90deg,var(--accent),var(--prim)); -webkit-background-clip:text; color:transparent;}
        .sub{color:#aaa; margin-top:8px;}

        .platform-tabs{display:flex; justify-content:center; gap:10px; margin:20px 0; flex-wrap:wrap;}
        .tab{padding:12px 24px; border-radius:30px; border:none; cursor:pointer; font-weight:600; transition:.3s; background:rgba(255,255,255,.1); color:white;}
        .tab.active{transform:scale(1.05); box-shadow:0 4px 15px rgba(108,92,231,.4);}
        .tab.fb{background:var(--fb);}
        .tab.tt{background:linear-gradient(90deg,#25F4EE,#FE2C55); color:#000;}
        .tab.x{background:var(--x); border:1px solid #fff;}
        .specs{text-align:center; color:#ccc; font-size:.9rem; margin-bottom:20px;}

        .grid{display:grid; grid-template-columns:1fr 1fr; gap:25px;}
        @media(max-width:900px){.grid{grid-template-columns:1fr;}}
        .card{background:var(--card); border-radius:var(--radius); padding:25px; box-shadow:var(--shadow);}
        .card h2{font-size:1.2rem; margin-bottom:20px; color:var(--accent); display:flex; align-items:center; gap:8px;}

        input,textarea,select,button{border-radius:10px; border:none; font-size:1rem; outline:none;}
        input,textarea,select{width:100%; padding:14px; background:rgba(255,255,255,.1); color:var(--text-light); margin-bottom:15px;}
        input::placeholder,textarea::placeholder{color:#888;}
        label{font-size:.9rem; color:#bbb; display:block; margin-bottom:5px;}
        .btn{padding:14px 24px; font-weight:600; cursor:pointer; transition:.3s;}
        .btn:hover{transform:translateY(-2px);}
        .btn-primary{background:linear-gradient(90deg,var(--prim),var(--sec)); color:white; width:100%;}
        .btn-ai{background:linear-gradient(90deg,var(--free),#00B4D8); color:white; margin-bottom:15px; width:100%; font-size:1.05rem;}
        .btn-ai span{font-size:1.2rem;}
        .btn-row{display:flex; gap:10px; flex-wrap:wrap; margin-top:15px;}
        .btn-fb{background:var(--fb); color:white; flex:1; min-width:120px;}
        .btn-tt{background:linear-gradient(90deg,#25F4EE,#FE2C55); color:#000; flex:1; min-width:120px;}
        .btn-x{background:#000; color:white; border:1px solid #fff; flex:1; min-width:120px;}
        .btn-sm{padding:8px 14px; font-size:.9rem;}

        .template-search{margin-bottom:10px;}
        .template-cats{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
        .cat-tab{padding:6px 14px; border-radius:20px; background:rgba(255,255,255,.1); color:white; border:none; cursor:pointer; font-size:.85rem;}
        .cat-tab.active{background:var(--prim);}
        .templates{display:grid; grid-template-columns:repeat(auto-fill,minmax(100px,1fr)); gap:10px; max-height:280px; overflow-y:auto; padding-right:5px;}
        .template-img{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; cursor:pointer; border:3px solid transparent; transition:.2s;}
        .template-img:hover,.template-img.selected{border-color:var(--prim); transform:scale(1.05);}
        .custom-templates{margin-top:15px; padding-top:15px; border-top:1px solid rgba(255,255,255,.1);}

        .preview-wrapper{position:sticky; top:20px;}
        .preview-box{background:white; border-radius:12px; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:500px; position:relative;}
        #memeCanvas{max-width:100%; height:auto; display:block;}
        .live-indicator{position:absolute; top:10px; right:10px; background:var(--success); color:white; padding:4px 10px; border-radius:20px; font-size:.8rem; font-weight:600;}

        .slider-row{display:flex; align-items:center; gap:10px; margin-bottom:15px;}
        .slider-row label{flex:1; margin:0;}
        .slider-row input[type="range"]{flex:2; margin:0;}
        .slider-row span{min-width:40px; text-align:right; color:var(--accent); font-weight:600;}

        .emoji-bar{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; margin-bottom:15px;}
        .emoji-btn{font-size:1.5rem; background:rgba(255,255,255,.1); border:none; border-radius:8px; padding:6px 10px; cursor:pointer; transition:.2s;}
        .emoji-btn:hover{background:var(--prim); transform:scale(1.2);}

        .ai-prompt{display:flex; gap:10px; margin-bottom:15px;}
        .ai-prompt input{flex:1; margin:0;}
        .btn-go{padding:0 20px; background:var(--free); color:white; white-space:nowrap;}

        .history-section{margin-top:25px; padding-top:20px; border-top:1px solid rgba(255,255,255,.1);}
        .history-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(80px,1fr)); gap:8px; margin-top:10px;}
        .history-item{width:100%; aspect-ratio:1/1; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid transparent;}
        .history-item:hover{border-color:var(--prim);}

        .toast{position:fixed; bottom:30px; left:50%; transform:translateX(-50%) translateY(100px); background:var(--card); color:white; padding:15px 30px; border-radius:30px; box-shadow:var(--shadow); z-index:999; transition:.3s; opacity:0; max-width:90%; text-align:center;}
        .toast.show{transform:translateX(-50%) translateY(0); opacity:1;}
    </style>
</head>
<body>

            <div class="slider-row">

            <div class="slider-row">

                <input type="range" id="textOffsetY" min="-50" max="50" value="0">

            <label>Export Resolution</label>

                <option value="4" selected>4K Ultra-HD (4x — Best Quality)</option>

            <button class="btn btn-primary" id="saveProject">💾 Save Project</button>
            <button class="btn btn-primary" id="loadProject" style="background:rgba(255,255,255,.1); color:var(--text-light); margin-top:8px;">📂 Load Project</button>

            <div class="btn-row">
                <button class="btn btn-fb" id="shareFb">📘 Share</button>
                <button class="btn btn-tt" id="shareTt">🎵 Share</button>

            <div class="btn-row">

                <button class="btn btn-tt" id="dlTt">🎵 Download</button>
                <button class="btn btn-x" id="dlX">𝕏 Download</button>
            </div>
        </div>

        <div class="card preview-wrapper">
            <h2>👁️ Live Preview</h2>
            <div class="preview-box">
                <canvas id="memeCanvas" width="1200" height="1200"></canvas>
                <span class="live-indicator">LIVE</span>
            </div>
            <p style="margin-top:15px; color:#888; font-size:.9rem;">💡 Edits update instantly — works offline!</p>
            <button class="btn" id="copyImage" style="background:var(--free); color:white; width:100%; margin-top:10px;">📋 Copy Image to Clipboard</button>

            <div class="history-section">
                <h3 style="font-size:1rem; color:var(--accent); margin-bottom:10px;">📚 Recent Memes</h3>

            </div>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>

function showToast(msg, duration=2500){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(()=>t.classList.remove('show'), duration);
}

function smartAIGenerate(prompt){
    const p = (prompt || '').toLowerCase();
    let category = 'default';
    if(p.includes('monday') || p.includes('morning') || p.includes('weekday')) category = 'monday';
    else if(p.includes('work') || p.includes('boss') || p.includes('meeting') || p.includes('job')) category = 'work';
    else if(p.includes('cat') || p.includes('dog') || p.includes('animal') || p.includes('pet')) category = 'cat';
    else if(p.includes('funny') || p.includes('joke') || p.includes('laugh') || p.includes('hilarious')) category = 'funny';
    else if(p.includes('relate') || p.includes('me') || p.includes('feel') || p.includes('real')) category = 'relatable';
    else if(p.includes('school') || p.includes('study') || p.includes('exam') || p.includes('teacher')) category = 'school';
    else if(p.includes('tech') || p.includes('computer') || p.includes('code') || p.includes('program')) category = 'tech';
    
    const pool = smartAIDb[category];
    return pool[Math.floor(Math.random() * pool.length)];
}

document.getElementById('themeToggle').addEventListener('click', ()=>{
    document.body.classList.toggle('light-mode');
    document.getElementById('themeToggle').textContent = 
        document.body.classList.contains('light-mode') ? '☀️' : '🌙';
    renderMeme();
});

function renderTemplates(filter='all', search=''){
    const gallery = document.getElementById('templateGallery');
    gallery.innerHTML = '';
    templates.filter(t => {
        const matchCat = filter==='all' || t.cat===filter;
        const matchSearch = !search || t.name.toLowerCase().includes(search.toLowerCase());
        return matchCat && matchSearch;
    }).forEach(t => {
        const img = document.createElement('img');
        img.src = t.src; img.alt = t.name; img.title = t.name;
        img.className = 'template-img';
        img.onclick = () => {
            document.querySelectorAll('.template-img').forEach(el => el.classList.remove('selected'));
            img.classList.add('selected');
            selectedImage = new Image();
            selectedImage.crossOrigin = 'anonymous';
            selectedImage.onload = ()=>renderMeme();
            selectedImage.src = t.src;
            showToast(`✅ Loaded: ${t.name}`);
        };
        gallery.appendChild(img);
    });
}
renderTemplates();

function renderCustomTemplates(){
    const gallery = document.getElementById('customGallery');
    gallery.innerHTML = '';
    customTemplates.forEach((src)=>{
        const img = document.createElement('img');
        img.src = src; img.className = 'template-img';
        img.onclick = ()=>{
            document.querySelectorAll('.template-img').forEach(el => el.classList.remove('selected'));
            selectedImage = new Image();
            selectedImage.onload = ()=>renderMeme();
            selectedImage.src = src;
            showToast('✅ Custom template loaded!');
        };
        gallery.appendChild(img);
    });
}
renderCustomTemplates();
document.getElementById('customTemplateUpload').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
        customTemplates.unshift(ev.target.result);
        if(customTemplates.length>20) customTemplates.pop();
        localStorage.setItem('customTemplates', JSON.stringify(customTemplates));
        renderCustomTemplates();
        showToast('✅ Saved to custom templates!');
    };
    reader.readAsDataURL(file);
});

document.getElementById('templateSearch').addEventListener('input', e=>renderTemplates(document.querySelector('.cat-tab.active')?.dataset.cat||'all', e.target.value));
document.querySelectorAll('.cat-tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
        document.querySelectorAll('.cat-tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        renderTemplates(tab.dataset.cat, document.getElementById('templateSearch').value);
    });
});

document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click', ()=>{
        document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
        tab.classList.add('active');
        currentPlatform = tab.dataset.platform;
        const p = platforms[currentPlatform];
        document.getElementById('platformSpecs').textContent = 
            `📐 ${p.name} — Aspect Ratio: ${p.ratio} | ${p.w}×${p.h}`;
        document.getElementById('memeCanvas').width = p.w;
        document.getElementById('memeCanvas').height = p.h;
        renderMeme();
    });
});

function generateMemeText(){
    const prompt = document.getElementById('aiPrompt').value.trim() || 'funny relatable meme';
    const result = smartAIGenerate(prompt);
    document.getElementById('topText').value = result.top;
    document.getElementById('bottomText').value = result.bottom;
    renderMeme();
    showToast('✨ AI caption generated!');
}
document.getElementById('aiGenerate').addEventListener('click', generateMemeText);
document.getElementById('aiGo').addEventListener('click', generateMemeText);

document.querySelectorAll('.emoji-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
        const active = document.activeElement;
        const emoji = btn.textContent;
        if(active.id==='topText' || active.id==='bottomText'){
            active.value += emoji;
        } else {
            document.getElementById('topText').value += emoji;
        }
        renderMeme();
    });
});

['topText','bottomText','fontSize','textColor','outlineColor','outlineWidth','textOffsetY'].forEach(id=>{
    const el = document.getElementById(id);
    el.addEventListener('input', ()=>{
        state.top = document.getElementById('topText').value.toUpperCase();
        state.bottom = document.getElementById('bottomText').value.toUpperCase();
        state.fontSize = parseInt(document.getElementById('fontSize').value);
        state.textColor = document.getElementById('textColor').value;
        state.outlineColor = document.getElementById('outlineColor').value;
        state.outlineWidth = parseFloat(document.getElementById('outlineWidth').value);
        state.offsetY = parseInt(document.getElementById('textOffsetY').value);
        document.getElementById('sizeVal').textContent = state.fontSize;
        document.getElementById('outlineVal').textContent = state.outlineWidth;
        document.getElementById('offsetVal').textContent = state.offsetY;
        renderMeme();
    });
});

document.getElementById('imageUpload').addEventListener('change', e=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = ev=>{
        selectedImage = new Image();
        selectedImage.crossOrigin = 'anonymous';
        selectedImage.onload = ()=>{
            showToast('📷 Image loaded!');
            renderMeme();
        };
        selectedImage.src = ev.target.result;
    };
    reader.readAsDataURL(file);
});

function saveToHistory(){
    const canvas = document.getElementById('memeCanvas');
    if(!selectedImage) return;
    const thumbnail = canvas.toDataURL('image/png', 0.5);
    memeHistory.unshift({
        thumb: thumbnail,
        top: state.top,
        bottom: state.bottom,
        platform: currentPlatform,
        timestamp: Date.now()
    });
    if(memeHistory.length>30) memeHistory.length=30;
    localStorage.setItem('memeHistory', JSON.stringify(memeHistory));
    renderHistory();
}
function renderHistory(){
    const grid = document.getElementById('historyGrid');
    grid.innerHTML = '';
    memeHistory.forEach((item)=>{
        const img = document.createElement('img');
        img.src = item.thumb; img.className = 'history-item';
        img.title = `${item.top} / ${item.bottom}`;
        img.onclick = ()=>{
            document.getElementById('topText').value = item.top || '';
            document.getElementById('bottomText').value = item.bottom || '';
            if(item.platform) document.querySelector(`[data-platform="${item.platform}"]`)?.click();
            renderMeme();
            showToast('✅ Loaded from history!');
        };
        grid.appendChild(img);
    });
}
renderHistory();
document.getElementById('clearHistory').addEventListener('click', ()=>{
    memeHistory = [];
    localStorage.removeItem('memeHistory');
    renderHistory();
    showToast('🗑️ History cleared!');
});

function renderMeme(){
    if(!selectedImage) return;
    const canvas = document.getElementById('memeCanvas');
    const ctx = canvas.getContext('2d');
    const p = platforms[currentPlatform];
    canvas.width = p.w; canvas.height = p.h;

    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);

    const imgR = selectedImage.width / selectedImage.height;
    const canR = canvas.width / canvas.height;
    let dw, dh, ox, oy;
    if(imgR > canR){ dh = canvas.height; dw = selectedImage.width*(dh/selectedImage.height); ox=(canvas.width-dw)/2; oy=0; }
    else { dw = canvas.width; dh = selectedImage.height*(dw/selectedImage.width); ox=0; oy=(canvas.height-dh)/2; }
    ctx.drawImage(selectedImage, ox, oy, dw, dh);

    ctx.font = `bold ${state.fontSize}px Impact, Haettenschweiler, sans-serif`;
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    const offset = state.offsetY;

    if(state.top){
        ctx.textBaseline = 'top';
        ctx.strokeStyle = state.outlineColor;
        ctx.lineWidth = state.outlineWidth * (state.fontSize/40);
        ctx.strokeText(state.top, canvas.width/2, 20+offset);
        ctx.fillStyle = state.textColor;
        ctx.fillText(state.top, canvas.width/2, 20+offset);
    }
    if(state.bottom){
        ctx.textBaseline = 'bottom';
        ctx.strokeStyle = state.outlineColor;
        ctx.lineWidth = state.outlineWidth * (state.fontSize/40);
        ctx.strokeText(state.bottom, canvas.width/2, canvas.height-20-offset);
        ctx.fillStyle = state.textColor;
        ctx.fillText(state.bottom, canvas.width/2, canvas.height-20-offset);
    }
}

function download(name){
    if(!selectedImage){ showToast('⚠️ Select an image first!'); return; }
    saveToHistory();
    const canvas = document.getElementById('memeCanvas');
    const res = parseInt(document.getElementById('resolution').value);
    if(res===1){
        const link = document.createElement('a');
        link.download = `meme-${name}-${Date.now()}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast(`✅ Downloaded for ${name}!`);
        return;
    }
    const p = platforms[currentPlatform];
    const offscreen = document.createElement('canvas');
    offscreen.width = p.w * res;
    offscreen.height = p.h * res;
    const ctx = offscreen.getContext('2d');
    const imgR = selectedImage.width / selectedImage.height;
    const canR = offscreen.width / offscreen.height;
    let dw, dh, ox, oy;
    if(imgR > canR){ dh = offscreen.height; dw = selectedImage.width*(dh/selectedImage.height); ox=(offscreen.width-dw)/2; oy=0; }
    else { dw = offscreen.width; dh = selectedImage.height*(dw/selectedImage.width); ox=0; oy=(offscreen.height-dh)/2; }
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,offscreen.width,offscreen.height);
    ctx.drawImage(selectedImage, ox, oy, dw, dh);
    const scale = res;
    ctx.font = `bold ${state.fontSize*scale}px Impact, sans-serif`;
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    const offset = state.offsetY * scale;
    if(state.top){
        ctx.textBaseline = 'top';
        ctx.strokeStyle = state.outlineColor;
        ctx.lineWidth = state.outlineWidth * scale * (state.fontSize/40);
        ctx.strokeText(state.top, offscreen.width/2, 20*scale+offset);
        ctx.fillStyle = state.textColor;
        ctx.fillText(state.top, offscreen.width/2, 20*scale+offset);
    }
    if(state.bottom){
        ctx.textBaseline = 'bottom';
        ctx.strokeStyle = state.outlineColor;
        ctx.lineWidth = state.outlineWidth * scale * (state.fontSize/40);
        ctx.strokeText(state.bottom, offscreen.width/2, offscreen.height-20*scale-offset);
        ctx.fillStyle = state.textColor;
        ctx.fillText(state.bottom, offscreen.width/2, offscreen.height-20*scale-offset);
    }
    const link = document.createElement('a');
    link.download = `meme-${name}-${res}x-${Date.now()}.png`;
    link.href = offscreen.toDataURL('image/png', 1.0);
    link.click();
    showToast(`✅ ${res}x Resolution — Downloaded!`);
}
document.getElementById('dlFb').addEventListener('click', ()=>download('facebook'));
document.getElementById('dlTt').addEventListener('click', ()=>download('tiktok'));
document.getElementById('dlX').addEventListener('click', ()=>download('x'));

function shareTo(platform){
    if(!selectedImage){ showToast('⚠️ Select an image first!'); return; }
    saveToHistory();
    const canvas = document.getElementById('memeCanvas');
    canvas.toBlob(blob=>{
        const file = new File([blob], 'meme.png', {type:'image/png'});
        if(navigator.canShare && navigator.canShare({files:[file], title:'My Meme', text:'Made with Free AI Meme Generator! 🤖'})){
            navigator.share({files:[file], title:'My Meme', text:'Made with Free AI Meme Generator 🤖'});
            showToast(`📤 Sharing to ${platform}...`);
        } else {
            const urls = {
                facebook:'https://www.facebook.com/sharer/sharer.php?u=',
                x:'https://twitter.com/intent/tweet?text=Check out my meme!&url=',
                tiktok:'https://www.tiktok.com/upload'
            };
            const dataUrl = canvas.toDataURL();
            window.open(urls[platform] + encodeURIComponent(dataUrl), '_blank');
            showToast(`🌐 Opening ${platform}...`);
        }
    }, 'image/png');
}
document.getElementById('shareFb').addEventListener('click', ()=>shareTo('facebook'));
document.getElementById('shareTt').addEventListener('click', ()=>shareTo('tiktok'));
document.getElementById('shareX').addEventListener('click', ()=>shareTo('x'));

document.getElementById('copyImage').addEventListener('click', async ()=>{
    if(!selectedImage){ showToast('⚠️ Create a meme first!'); return; }
    saveToHistory();
    const canvas = document.getElementById('memeCanvas');
    canvas.toBlob(async blob=>{
        try{
            await navigator.clipboard.write([new ClipboardItem({'image/png':blob})]);
            showToast('📋 Image copied to clipboard!');
        }catch(e){ showToast('❌ Copy failed — try download instead'); }
    }, 'image/png');
});

document.getElementById('saveProject').addEventListener('click', ()=>{
    if(!selectedImage){ showToast('⚠️ Create a meme first!'); return; }
    localStorage.setItem('memeState', JSON.stringify({
        top:state.top, bottom:state.bottom, fontSize:state.fontSize,
        textColor:state.textColor, outlineColor:state.outlineColor,
        outlineWidth:state.outlineWidth, platform:currentPlatform,
        imageSrc: selectedImage.src
    }));
    showToast('💾 Project saved!');
});
document.getElementById('loadProject').addEventListener('click', ()=>{
    const data = localStorage.getItem('memeState');
    if(!data) { showToast('❌ No saved project!'); return; }
    const s = JSON.parse(data);
    document.getElementById('topText').value = s.top || '';
    document.getElementById('bottomText').value = s.bottom || '';
    document.getElementById('fontSize').value = s.fontSize || 45;
    document.getElementById('textColor').value = s.textColor || '#ffffff';
    document.getElementById('outlineColor').value = s.outlineColor || '#000000';
    document.getElementById('outlineWidth').value = s.outlineWidth || 3;
    state = { top:(s.top||'').toUpperCase(), bottom:(s.bottom||'').toUpperCase(), fontSize:s.fontSize||45, textColor:s.textColor||'#ffffff', outlineColor:s.outlineColor||'#000000', outlineWidth:s.outlineWidth||3, offsetY:0 };
    if(s.platform) document.querySelector(`[data-platform="${s.platform}"]`)?.click();
    if(s.imageSrc){
        selectedImage = new Image();
        selectedImage.crossOrigin = 'anonymous';
        selectedImage.onload = ()=>renderMeme();
        selectedImage.src = s.imageSrc;
    }
    renderMeme();
    showToast('✅ Project loaded!');
});
</script>
